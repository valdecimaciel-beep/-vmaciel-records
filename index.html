<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VMACIEL STUDIO v9 - LIMPO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,system-ui,sans-serif}
body{background:#050505;color:#fff;padding:20px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.brand{font-weight:900;letter-spacing:.2em}
.brand span{color:#FFD700}
.langs{display:flex;gap:8px}
.langs button{background:#151515;border:1px solid #333;color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer}
.langs button.active{background:#FFD700;color:#000;border-color:#FFD700;font-weight:800}
#info{margin:10px 0;color:#888;font-size:12px}
#vmaciel-genres-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:20px 0}
#vmaciel-genres-grid button{background:#151515;border:1px solid rgba(255,255,255,.08);color:#fff;padding:12px;border-radius:10px;font-size:12px;text-align:left;cursor:pointer;transition:.2s}
#vmaciel-genres-grid button:hover{border-color:#FFD700}
#vmaciel-genres-grid button.selected{border-color:#FFD700;background:rgba(255,215,0,.15);color:#FFD700}
textarea{width:100%;min-height:280px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:16px;color:#fff;font-size:13px;line-height:1.6;resize:vertical}
#genMusicBtn{width:100%;height:56px;border-radius:16px;background:#FFD700;color:#000;font-weight:900;letter-spacing:.18em;border:0;cursor:pointer;margin-top:16px}
#genMusicBtn:hover{background:#FFDF33}
#log{background:#0a0a0a;border:1px solid #222;border-radius:12px;padding:12px;margin-top:12px;font-size:11px;white-space:pre-wrap;color:#aaa;max-height:200px;overflow:auto}
</style>
</head>
<body>
<div class="header">
<div class="brand">VMACIEL <span>STUDIO v9 - LIMPO</span></div>
<div class="langs">
<button id="btn-lang-pt" class="active" onclick="vmacielSetLang('pt')">🇧🇷 PT</button>
<button id="btn-lang-en" onclick="vmacielSetLang('en')">🇺🇸 EN</button>
<button id="btn-lang-es" onclick="vmacielSetLang('es')">🇪🇸 ES</button>
<button id="btn-lang-fr" onclick="vmacielSetLang('fr')">🇫🇷 FR</button>
</div>
</div>

<div id="info"><span id="lang-flag-big">🇧🇷</span> <span id="lang-name-big">Português</span> - <span id="lang-count">0 estilos</span> - Selecionado: <b id="selected-genre-label" style="color:#FFD700">nenhum</b></div>

<input id="vmaciel-search-input" placeholder="BUSCAR estilo..." oninput="vmacielFilterGenres(this.value)" style="width:100%;background:#111;border:1px solid #222;border-radius:10px;padding:12px;color:#fff">

<div id="vmaciel-genres-grid"></div>

<div style="margin-top:20px">
<div style="display:flex;justify-content:space-between;margin-bottom:8px"><span style="font-size:11px;letter-spacing:.2em;color:rgba(255,255,255,.6)">LETRA EDITÁVEL</span><span id="char-count" style="font-size:11px;color:#666">0 caracteres</span></div>
<textarea id="lyricsArea" placeholder="Cole aqui sua letra feliz... Ex: a alegria de viver..."></textarea>
</div>

<button id="genMusicBtn" onclick="gerarMusica()">GERAR MÚSICA</button>

<div id="log">Console limpo - pronto pra gerar
</div>

<audio id="player" controls style="width:100%;margin-top:12px;display:none"></audio>

<script>
// LISTAS LIMPAS - sem V40.2, sem V29
window.VMACIEL_GENRES_BR = ["Sertanejo Sofrência","Sertanejo Universitário","Sertanejo Acústico","Modão Bruto","Forró Romântico","Piseiro Apaixonado","Arrocha Sofrência","Pagode anos 90","Funk Consciente","MPB Acústica","Trap Funk","Evangelho","Lo-fi Chill","Acústico Voz e Violão"];
window.VMACIEL_GENRES_US = ["Hip Hop Boombap","Trap Soul","R&B Soul","Country Heartbreak","Pop Anthem 2025","Indie Pop","Lo-fi Chill","Acoustic Voice & Guitar","Rock Ballad","EDM Festival","Gospel Worship"];
window.VMACIEL_GENRES_ES = ["Reggaeton Romántico","Reggaeton Perreo","Trap Latino","Bachata Romántica","Salsa Caliente","Cumbia Villera","Pop Latino 2025","Balada Romántica"];
window.VMACIEL_GENRES_FR = ["Rap FR Mélodique","Afro Love","Pop FR 2025","Variété Française","R&B FR Soul","Lo-fi Chill FR","Ballade Romantique"];

const FLAG_MAP={pt:'🇧🇷',en:'🇺🇸',es:'🇪🇸',fr:'🇫🇷'};
const NAME_MAP={pt:'Português • Brasil',en:'English • USA',es:'Español',fr:'Français'};
window.vmacielSelectedGenre = null;

function getGenresByCode(code){
  code=(code||'pt').toLowerCase();
  if(code.startsWith('en')) return window.VMACIEL_GENRES_US;
  if(code.startsWith('es')) return window.VMACIEL_GENRES_ES;
  if(code.startsWith('fr')) return window.VMACIEL_GENRES_FR;
  return window.VMACIEL_GENRES_BR;
}

function vmacielSetLang(code){
  code=(code||'pt').toLowerCase();
  localStorage.setItem('vmaciel_lang', JSON.stringify({code:code}));
  document.querySelectorAll('.langs button').forEach(b=>b.classList.remove('active'));
  const btn=document.getElementById('btn-lang-'+code);
  if(btn) btn.classList.add('active');
  vmacielRenderGenres(code);
}

function vmacielRenderGenres(code){
  code=(code||'pt').toLowerCase();
  const target=getGenresByCode(code);
  const grid=document.getElementById('vmaciel-genres-grid');
  document.getElementById('lang-flag-big').textContent=FLAG_MAP[code]||'🇧🇷';
  document.getElementById('lang-name-big').textContent=NAME_MAP[code]||'Português';
  document.getElementById('lang-count').textContent=target.length+' estilos';
  grid.innerHTML='';
  target.forEach(genre=>{
    const b=document.createElement('button');
    b.textContent=genre;
    b.dataset.genre=genre;
    b.onclick=()=>{
      document.querySelectorAll('#vmaciel-genres-grid button').forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected');
      window.vmacielSelectedGenre=genre;
      document.getElementById('selected-genre-label').textContent=genre;
      log('Estilo selecionado: '+genre);
    };
    grid.appendChild(b);
  });
  log('✅ Renderizados '+target.length+' estilos para '+code);
}

function vmacielFilterGenres(term){
  term=(term||'').toLowerCase();
  document.querySelectorAll('#vmaciel-genres-grid button').forEach(b=>{
    b.style.display = (!term || b.dataset.genre.toLowerCase().includes(term)) ? '' : 'none';
  });
}

function log(msg){
  const el=document.getElementById('log');
  el.textContent = new Date().toLocaleTimeString() + ' - ' + msg + '\n' + el.textContent;
  console.log(msg);
}

// GERAÇÃO CORRETA - LÊ SEMPRE DA LETRA EDITÁVEL
async function gerarMusica(){
  const area=document.getElementById('lyricsArea');
  let letraFinal=(area?.value||'').trim();

  if(!letraFinal || letraFinal.length < 10){
    alert('Cole sua letra na LETRA EDITÁVEL primeiro! Ex: a alegria de viver...');
    area?.focus();
    return;
  }

  // TRAVA DE SEGURANÇA: remove comandos que quebravam a Suno
  if(letraFinal.includes('cruz pesada')){
    log('🚫 Detectado cruz pesada - bloqueando envio quebrado');
    alert('Essa letra ainda é a triste da máquina! Apague e cole a letra feliz.');
    return;
  }
  // limpa tags problemáticas
  let letraLimpa = letraFinal.replace(/\[.*?Extended.*?\]/gi,'').replace(/\[.*?slow start.*?\]/gi,'').trim();
  
  const estilo = window.vmacielSelectedGenre || 'Sertanejo Sofrência';
  
  log('🎵 LETRA QUE VAI PRA SUNO (EDITADA): '+letraLimpa.slice(0,100));
  log('🎧 Estilo: '+estilo);

  const btn=document.getElementById('genMusicBtn');
  btn.textContent='GERANDO...';
  btn.disabled=true;

  try{
    const res = await fetch('/.netlify/functions/suno-proxy', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        prompt: letraLimpa, // AQUI VAI A FELIZ
        style: estilo,
        title: 'A Alegria de Viver',
        instrumental: false
      })
    });
    const data = await res.json();
    log('✅ RESPOSTA SUNO: '+JSON.stringify(data).slice(0,300));
    
    const url = data.audio_url || data.url || data.audioUrl;
    if(url){
      const player=document.getElementById('player');
      player.src=url;
      player.style.display='block';
      player.play();
      log('▶️ Áudio tocando: '+url);
    } else {
      log('⏳ Suno ainda gerando... aguarde: '+(data.taskId||'sem id'));
    }
  }catch(err){
    log('❌ ERRO: '+err.message);
    alert('Erro ao chamar suno-proxy: '+err.message+'\nVerifica se a função tá publicada na Netlify');
  } finally {
    btn.textContent='GERAR MÚSICA';
    btn.disabled=false;
  }
}

document.getElementById('lyricsArea').addEventListener('input', e=>{
  document.getElementById('char-count').textContent=e.target.value.length+' caracteres';
});

window.addEventListener('load', ()=>{
  const raw=localStorage.getItem('vmaciel_lang');
  let code='pt';
  try{ if(raw) code=JSON.parse(raw).code||'pt'; }catch{}
  vmacielSetLang(code);
});
</script>
</body>
</html>
