
 <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VMACIEL STUDIO 2.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background: #0A0A0C; }
    .gold-gradient { background: linear-gradient(90deg, #FFD60A 0%, #FFB700 100%); }
    .gold-text { background: linear-gradient(90deg, #FFD60A, #FFB700); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .card-dark { background: #111113; border: 1px solid #1E1E22; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fadeIn { animation: fadeIn 0.25s ease; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
