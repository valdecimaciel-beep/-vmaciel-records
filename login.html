
<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login - VM IA</title><link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body class="login-body">
<div class="login-box"><h1>VM IA</h1><h2>Entre na sua conta</h2>
<input type="email" id="email" placeholder="Seu e-mail">
<input type="password" id="password" placeholder="Sua senha">
<button onclick="login()" class="btn-primary full">Entrar</button>
<button onclick="cadastro()" class="btn-secondary full">Criar conta</button>
<p id="msg"></p><a href="index.html">← Voltar</a></div>
<script src="js/supabase-config.js"></script>
<script>
async function login(){
 const e=document.getElementById('email').value; const s=document.getElementById('password').value;
 const {data,error}=await supabaseClient.auth.signInWithPassword({email:e,password:s});
 document.getElementById('msg').innerText= error? error.message : 'Logado! Indo pra criação...';
 if(!error) setTimeout(()=>location.href='criacao.html',1000);
}
async function cadastro(){
 const e=document.getElementById('email').value; const s=document.getElementById('password').value;
 const {data,error}=await supabaseClient.auth.signUp({email:e,password:s});
 document.getElementById('msg').innerText= error? error.message : 'Conta criada! Verifique seu e-mail';
}
</script></body></html>
